<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>BACKROW — Field Study Presenter</title><link rel="stylesheet" href="styles.css"></head>
<body class="studyAdminBody"><header class="topbar darkbar"><a class="brand textLink" href="/"><span class="brandMark">BR</span><span>BACKROW</span></a><div class="topbarActions"><span class="localTag" data-i18n="tag">FIELD STUDY PRESENTER</span><button class="ghost small" id="langBtn" aria-label="Switch language">ID</button></div></header><main class="adminShell">
<section class="adminControls"><div><p class="eyebrow" data-i18n="eyebrow">LOCKED REAL-PROJECTOR TEST</p><h1 id="adminTitle" data-i18n="loading">Loading…</h1><p id="adminMeta"></p></div><div class="adminLinks"><button id="copyParticipant" class="secondary" data-i18n="copyUrl">Copy participant URL</button><button id="refreshResponses" class="secondary" data-i18n="refresh">Refresh responses</button><button id="exportStudy" class="secondary" data-i18n="export">Export study JSON</button></div></section>
<section id="adminError" class="errorPanel hidden"><div><b data-i18n="cannotLoad">Cannot load study.</b><p id="adminErrorText"></p></div></section>
<section id="projectionStage" class="projectionStage hidden"><div class="projectorFrame"><img id="projectedSlide" class="exposureHidden" alt="Source slide for physical projection"><div id="targetBox" class="studyTargetBox hidden"></div><div id="exposureBlank" class="exposureBlank"><span id="blankState" data-i18n="ready">READY</span><small id="blankHelp" data-i18n="readyHelp">Start the timed exposure when the reader is looking only at the projector.</small><div id="targetCue" class="targetCue" aria-label="Target region cue"><div id="cueBox" class="cueBox"></div></div></div><div class="targetBadge" id="targetBadge">TARGET 1</div><div id="exposureState" class="exposureState" data-i18n="ready">Ready</div></div><div class="targetNav"><button id="runExposure" class="primary" data-i18n="startExposure">Start timed exposure</button><button id="prevTarget" class="secondary" data-i18n="previous">← Previous</button><div><b id="targetCounter">1 / 1</b><small id="responseCounter">0 readers submitted</small></div><button id="nextTarget" class="primary" data-i18n="next">Next →</button><button id="fullScreen" class="secondary" data-i18n="fullscreen">Project fullscreen</button></div></section>
<section class="studyTruth"><details><summary data-i18n="truthSummary">Presenter-only source truth & captured evidence</summary><div id="truthGrid"></div></details></section>
</main><script src="locale.js"></script><script src="study_admin.js"></script></body></html>
